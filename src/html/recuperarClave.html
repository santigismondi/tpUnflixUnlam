<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UNFLIX | Recupera tu clave</title>
    <link rel="stylesheet" href="../css/headerYfooter.css">
    <link rel="stylesheet" href="../css/registro.css">
    <link rel="stylesheet" href="../css/recuperarClave.css">
    <link rel="shortcut icon" href="../recursos/imagenes/unlam-universidad-nacional-de-la-matanza-seeklogo.png"> 
    
</head>
<body>
        <header>
            <nav class="navegador">
                <section class="logo">
                    <img class="logoUnlam" 
                    src="../recursos/imagenes/unlam-universidad-nacional-de-la-matanza-seeklogo.png"
                    alt="Logo de Unlam">
                    <a class="logoDescripcion" href="/index.html">UNFLIX</a>  
                </section>
        

                <ul class="headerList">
                    <li class="headerListItem">
                        <a class="botonNav" href="/index.html">Iniciar Sesion</a>
                    </li>
                    <li class="headerListItemRegistrarse">
                        <a class="botonNavRegistrarse" href="./registro.html">Registrarse</a>
                    </li>
                </ul>
            </nav>
        </header> 
        
        <main class="contenedorMain">            
            <div class="container">
                <h2 class="titulo">UNFLIX</h2>
                <h2>Recuperar contraseña</h2>
                
                <form id="formRecuperar">
                    <input type="text" id="usuario" name="usuario" placeholder="Nombre de usuario" required>
                    <input type="email" id="email" name="email" placeholder="Correo electrónico" required>
                    
                    <div class="recovery-buttons">
                        <input type="submit" value="Confirmar" id="btnConfirmar" class="send-pass" disabled>
                    </div>
                </form>
                <a href="../../index.html"><button class="cancelar">Cancelar</button></a>
                <p id="mensajeError"></p>
            </div>
        </main>

        <footer class="contenedorFooter">
        <p>Santiago Gismondi | Nicolas Gerez | Gonzalo Nasi | Agustin Sequeira</p>
        </footer>

    <script src="../js/recuperarClave.js"></script>
</body>
</html>

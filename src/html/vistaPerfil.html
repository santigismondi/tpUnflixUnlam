<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UNFLIX | Mi Perfil</title>
    <link rel="stylesheet" href="../css/headerYfooter.css">
    <link rel="stylesheet" href="../css/vistaPerfil.css">
    <link rel="shortcut icon" href="../recursos/imagenes/unlam-universidad-nacional-de-la-matanza-seeklogo.png"> 
    <script src="https://kit.fontawesome.com/2edf5860bb.js" crossorigin="anonymous"></script>
</head>
<body>
    <header>
        <nav class="navegador">
            <section class="logo">
                <img class="logoUnlam" 
                src="../recursos/imagenes/unlam-universidad-nacional-de-la-matanza-seeklogo.png"
                alt="Logo de Unlam">
                <a class="logoDescripcion" href="../html/paginaInicio.html">UNFLIX</a>  
            </section>
     
            <ul class="headerList">
                <li class="headerListItem">                    
                    <a class="botonNav" href="../html/paginaInicio.html">
                        <span class="iconoNav"><i class="fa-solid fa-house"></i></span>
                        <span class="textoNav">Inicio</span>
                    </a>
                </li>
                <li class="headerListItem">
                    <a class="botonNav" href="../html/paginaPeliculas.html">
                        <span class="iconoNav"><i class="fa-solid fa-film"></i></span>
                        <span class="textoNav">Películas</span>
                    </a>
                </li>
                <li class="headerListItem">
                    <a class="botonNav" href="../html/paginaSeries.html">
                        <span class="iconoNav"><i class="fa-solid fa-tv"></i></span>
                        <span class="textoNav">Series</span>
                    </a>
                </li>
            </ul>
            <ul class="headerList">
                <li class="headerListItem">
                    <a class="botonNav" href="../html/favoritos.html">
                        <span class="iconoNav"><i class="fa-solid fa-heart-circle-check"></i></span>
                        <span class="textoNav">Favoritos</span>
                    </a>
                </li>
                <li class="headerListItem">
                    <a class="botonNav" href="../html/vistaPerfil.html">
                        <span class="iconoNav"><i class="fa-solid fa-circle-user"></i></span>
                        <span class="textoNav">Mi Perfil</span>
                    </a>
                </li>
            </ul>
        </nav>
    </header>
    <main class="contenedorMain">
        <section class="elementosInicio">
            <section class="vista">
                <label for="listaVistas" class="labelVista">Vista</label>
                <select name="vista" id="listaVistas" class="selectVista">
                    <option class="opcionesVista" value="Fila">Fila</option>
                    <option class="opcionesVista" value="Columna">Columna</option>
                </select>
            </section>
        </section>
        <section class="contenedorTitulo">
            <h1 class="tituloPerfil">Mi Perfil</h1>
        </section>
        <section class="contenedorPerfil">
            <section class="fotoPerfil">
                <img class="imagenPerfil" src="../recursos/imagenes/iconoPerfil.png" alt="fotoPerfi">
                <p id="idLabelNombreUsuario" class="nombreDeUsuario">Nombre del Usuario</p>
                <section class="botonesFormulario">
                    <button type="reset" class="botonCerrarSesion" id="btnCerrarSesion"><a class="linkCancelar" href="../../index.html">Cerrar Sesion</a></button>
                </section>
            </section>
            <form action="" class="formularioPerfil">
                <section class="datosUsuario">
                    <section class="labelsUsuario">
                        <label id="idLabelMail" class="labelForm">E-mail</label>
                        <label id="idLabelContra" class="labelForm">Contraseña</label>
                        <label id="idLabelNewContra" class="labelForm">Nueva Contraseña</label>
                        <label id="idLabelConfirmContra" class="labelForm">Confirmar</label>
                    </section>
                    <section class="formularioUsuario">
                        <label id="idEmailUser" class="labelForm">usuario1@gmail.com</label>
                        <label id="idContraUser" class="labelForm">********</label>
                        <input id="idFormNewContra" type="password" class="inputForm" placeholder="">
                        <input id="idFormConfirmContra" type="password" class="inputForm" placeholder="">
                    </section>
                </section>
                <section class="metodoDePago">
                    <label for="" class="labelFormPago">
                        <input name="pago" type="radio" class="inputFormPago" value="tarjeta">Tarjeta de credito
                        <input name="pagoTarjeta" type="number" class="inputForm" placeholder="XXXX XXXX XXXX XXXX">
                        <input name="pagoTarjeta" type="number" class="inputFormCVV" placeholder="CVV">
                    </label>
                    <label for="" class="labelFormPago">
                        <input name="pago" type="radio" class="inputFormPago" value="cupon">Cupon de pago
                        <section class="checkboxPagoContainer">
                            <label for="pagoCupon">
                                <input name="pagoCupon" value="pago_facil" type="checkbox" class="checkboxPago">
                                Pago Facil
                            </label>
                            <label for="pagoCupon">
                                <input name="pagoCupon" value="rapipago" type="checkbox" class="checkboxPago">
                                Rapipago
                            </label>
                        </section>
                    </label>
                    <label for="" class="labelFormPago">
                        <input name="pago" type="radio" class="inputFormPago" value="transferencia">Transferencia Bancaria
                        <p class="CBU">CBU: 0000111166665555</p>
                    </label>
                </section>
                <section class="botonesFormulario">
                    <button type="submit" class="botonGuardar" id="btnGuardarCambios"><a class="linkGuardar" href="../html/paginaInicio.html">Guardar cambios</a></button>                
                </section>
                <section class="botonesFormulario">
                    <button type="reset" class="botonCancelar" id="btnCancelarSuscripcion"><a class="linkCancelar" href="../../index.html">Cancelar Subscripción</a></button>
                </section>
            </form>
        </section>
        <section id="error" class="mesajeError"></section>
    </main>
    <script src="../js/vistaPerfil.js"></script>
    <footer class="contenedorFooter">
        <p>Santiago Gismondi | Nicolas Gerez | Gonzalo Nasi | Agustin Sequeira</p>
    </footer>
</body>
</html>
